# Cấu hình triển khai tự động dịch vụ Web J5Hienloader (Node.js + WebSocket TCP Relay) trên Render.com
services:
  - type: web
    name: j5hienloader-web
    runtime: node
    plan: free
    rootDir: universal_loader/web
    buildCommand: node -v
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
